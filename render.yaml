services:
  - type: web
    name: parts-garage-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://egorfateew-ops.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: TECDOC_VIN_BASE_URL
        value: https://vehicle-identification.tecalliance.services
      - key: TECDOC_VIN_COUNTRY
        value: RU
      - key: TECDOC_VIN_API_KEY
        sync: false
      - key: TECDOC_VIN_AUTH_HEADER
        value: Authorization
      - key: TECDOC_VIN_AUTH_PREFIX
        value: ""
      - key: TECDOC_PROVIDER_ID\n        sync: false\n      - key: TECDOC_PARTS_URL
        sync: false
      - key: TECDOC_PARTS_API_KEY
        sync: false
      - key: TECDOC_PARTS_AUTH_HEADER
        value: Authorization
      - key: TECDOC_PARTS_AUTH_PREFIX
        value: ""
      - key: TECDOC_PARTS_METHOD
        value: POST
      - key: TECDOC_PARTS_REQUEST_TEMPLATE
        sync: false
      - key: TECDOC_PRODUCT_GROUP_MAP
        value: "{}"
      - key: TECDOC_CATALOG_COUNTRY
        value: RU
      - key: TECDOC_CATALOG_LANGUAGE
        value: RU
